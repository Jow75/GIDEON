version: '3.8'

services:
  gideon-core-1:
    build: .
    container_name: gideon_core_1
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EVENT_BROKER_TYPE=redis
      - NODE_ID=node-1
      - POSTGRES_URL=postgresql://gideon:gideon_secret@postgres:5432/gideon_db
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  gideon-core-2:
    build: .
    container_name: gideon_core_2
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - EVENT_BROKER_TYPE=redis
      - NODE_ID=node-2
      - POSTGRES_URL=postgresql://gideon:gideon_secret@postgres:5432/gideon_db
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gideon_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: gideon_postgres
    environment:
      - POSTGRES_USER=gideon
      - POSTGRES_PASSWORD=gideon_secret
      - POSTGRES_DB=gideon_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gideon -d gideon_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - gideon_postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: gideon_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    restart: unless-stopped
    volumes:
      - gideon_qdrant_data:/qdrant/storage

volumes:
  gideon_postgres_data:
  gideon_qdrant_data:
